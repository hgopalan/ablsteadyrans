name: CI

# Runs on every pull request, so a change that breaks a build, a unit test or
# a smoke run shows up on the PR rather than after it merges. Kestrel runs
# the --physics and performance tests nightly; they are not part of this file.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_COMPRESS: "true"
  CCACHE_MAXSIZE: "1G"

jobs:
  # ---------------------------------------------------------------------
  # CPU with MPI, double precision: build, then the unit and smoke tests.
  # The unit tests run on 1, 2 and 4 ranks; the runners have 2 cores, so
  # Open MPI gets --oversubscribe. GCC on Linux traps floating-point
  # exceptions (amrex.fpe_trap_invalid=1 in every test), which macOS does
  # not, so this is where an invalid operation shows up.
  # ---------------------------------------------------------------------
  cpu:
    name: CPU ${{ matrix.compiler }} ${{ matrix.build_type }}${{ matrix.testing && ' (AMReX_TESTING)' || '' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: gcc
            build_type: Release
            testing: false
          - compiler: gcc
            build_type: Debug
            testing: true
          - compiler: clang
            build_type: Release
            testing: false

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential clang cmake ninja-build ccache \
            libopenmpi-dev openmpi-bin libfftw3-dev

      - name: Set up ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-${{ matrix.compiler }}-${{ matrix.build_type }}-${{ github.sha }}
          restore-keys: ccache-${{ matrix.compiler }}-${{ matrix.build_type }}-

      - name: Configure
        run: |
          if [ "${{ matrix.compiler }}" = clang ]; then
            export CC=clang CXX=clang++
            export OMPI_CC=clang OMPI_CXX=clang++
          fi
          cmake -S . -B build-ci -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DABLSTEADY_MPI=ON \
            -DABLSTEADY_TESTING=${{ matrix.testing && 'ON' || 'OFF' }} \
            -DABLSTEADY_MPIEXEC_PREFLAGS=--oversubscribe \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: cmake --build build-ci --parallel

      - name: Unit and smoke tests
        run: ctest --test-dir build-ci -L "unit|smoke" --output-on-failure

      # Tests write only under build-ci/, which is ignored; anything else
      # they leave behind would land in a commit.
      - name: Working tree stays clean
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "The build or the tests left files behind:"
            git status --porcelain
            exit 1
          fi

      - name: ccache stats
        if: always()
        run: ccache -s

  # ---------------------------------------------------------------------
  # Single precision: compile only. The plan runs in double precision
  # (bit-reproducible residual histories, Newton finish to 1e-8 in phase 3);
  # single is kept compiling (literals, Real vs double) but not run here.
  # ---------------------------------------------------------------------
  single:
    name: Single precision (compile only)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build ccache libfftw3-dev

      - name: Set up ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-single-${{ github.sha }}
          restore-keys: ccache-single-

      - name: Configure and build
        run: |
          cmake -S . -B build-ci -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DABLSTEADY_MPI=OFF \
            -DABLSTEADY_PRECISION=SINGLE \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build build-ci --parallel

  # ---------------------------------------------------------------------
  # CUDA for the H100 (compute capability 9.0): compile only. Hosted
  # runners have no GPU. A device lambda that captures `this` or a host
  # container is a compile error under nvcc and invisible to a CPU build;
  # this job catches it. The H100 runs are on Kestrel.
  # ---------------------------------------------------------------------
  cuda:
    name: CUDA sm_90 (compile only)
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install CUDA toolkit
        uses: Jimver/cuda-toolkit@v0.2.19
        with:
          cuda: '12.4.1'
          method: 'network'
          use-github-cache: 'false'

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build

      - name: Configure and build
        run: |
          cmake -S . -B build-ci -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DABLSTEADY_MPI=OFF \
            -DABLSTEADY_GPU_BACKEND=CUDA \
            -DAMReX_CUDA_ARCH=9.0
          cmake --build build-ci --parallel

  # ---------------------------------------------------------------------
  # Windows CPU (MSVC, no MPI, double precision): build, then the unit and
  # smoke tests. Windows is where most fire users run WindNinja, so the
  # solver is built and tested there, not only compiled. FFTW comes from
  # vcpkg; AMReX finds it through its CMake config files on Windows. MSVC
  # does not trap floating-point exceptions, so the FPE check stays with the
  # Linux GCC job. The Kestrel shell-script tests are not registered here.
  # ---------------------------------------------------------------------
  windows:
    name: Windows MSVC Release
    runs-on: windows-latest
    env:
      PYTHONIOENCODING: utf-8

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install FFTW (vcpkg)
        run: vcpkg install fftw3:x64-windows

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure
        run: |
          cmake -S . -B build-ci -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake `
            -DVCPKG_TARGET_TRIPLET=x64-windows `
            -DABLSTEADY_MPI=OFF
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build
        run: |
          cmake --build build-ci --parallel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # The FFTW DLLs sit in the vcpkg tree, not next to the executables.
      - name: Unit and smoke tests
        run: |
          $env:PATH = "C:/vcpkg/installed/x64-windows/bin;$env:PATH"
          ctest --test-dir build-ci -L "unit|smoke" --output-on-failure
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  # ---------------------------------------------------------------------
  # CUDA on Windows: compile only (hosted runners have no GPU). The Windows
  # SDK is pinned to 10.0.22621.0: CUDA 12.6 with the newer SDK and C++20
  # fails on CRT header redefinitions (as in massconsistent_amr's CI).
  # ---------------------------------------------------------------------
  windows-cuda:
    name: Windows CUDA sm_90 (compile only)
    runs-on: windows-2022

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install CUDA toolkit
        uses: Jimver/cuda-toolkit@v0.2.19
        with:
          cuda: '12.6.1'
          sub-packages: '["nvcc", "cudart", "cuda_profiler_api", "cufft_dev", "cusparse_dev", "curand_dev"]'
          method: 'network'
          use-github-cache: 'false'

      - name: Install Ninja
        run: |
          curl.exe -L -o ninja-win.zip https://github.com/ninja-build/ninja/releases/download/v1.11.1/ninja-win.zip
          Expand-Archive -Path ninja-win.zip -DestinationPath .
          echo "$pwd" >> $env:GITHUB_PATH

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          sdk: 10.0.22621.0

      - name: Configure and build
        run: |
          cmake -S . -B build-ci -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_SYSTEM_VERSION=10.0.22621.0 `
            -DCMAKE_CXX_COMPILER=cl `
            -DCMAKE_CUDA_COMPILER=nvcc `
            -DABLSTEADY_MPI=OFF `
            -DABLSTEADY_GPU_BACKEND=CUDA `
            -DAMReX_CUDA_ARCH=9.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build-ci --parallel 4
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  # ---------------------------------------------------------------------
  # HIP (AMD, gfx90a = MI250X) and SYCL (Intel GPUs): compile only, as in
  # FastWindTerrain's CI. The FFT library follows the backend: rocFFT for
  # HIP, oneMKL for SYCL.
  # ---------------------------------------------------------------------
  hip:
    name: HIP gfx90a (compile only)
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build wget gnupg

      - name: Add the ROCm apt repository
        run: |
          sudo mkdir -p /etc/apt/keyrings
          wget -q -O - https://repo.radeon.com/rocm/rocm.gpg.key \
            | gpg --dearmor | sudo tee /etc/apt/keyrings/rocm.gpg > /dev/null
          echo 'deb [arch=amd64 signed-by=/etc/apt/keyrings/rocm.gpg] https://repo.radeon.com/rocm/apt/6.2.4 jammy main' \
            | sudo tee /etc/apt/sources.list.d/rocm.list
          printf 'Package: *\nPin: release o=repo.radeon.com\nPin-Priority: 600\n' \
            | sudo tee /etc/apt/preferences.d/rocm-pin-600
          sudo apt-get update -qq

      - name: Install ROCm/HIP
        run: |
          sudo apt-get install -y --no-install-recommends \
            rocm-dev rocrand-dev rocprim-dev rocsparse-dev rocfft-dev rocm-cmake

      - name: Configure and build
        run: |
          export PATH=/opt/rocm/llvm/bin:/opt/rocm/bin:$PATH
          cmake -S . -B build-ci -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=$(which clang) \
            -DCMAKE_CXX_COMPILER=$(which clang++) \
            -DABLSTEADY_MPI=OFF \
            -DABLSTEADY_GPU_BACKEND=HIP \
            -DAMReX_AMD_ARCH=gfx90a
          cmake --build build-ci --parallel

  sycl:
    name: SYCL (compile only)
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build wget gnupg

      - name: Add the Intel oneAPI apt repository
        run: |
          wget -O- https://apt.repos.intel.com/intel-gpg-keys/GPG-PUB-KEY-INTEL-SW-PRODUCTS.PUB \
            | gpg --dearmor \
            | sudo tee /usr/share/keyrings/oneapi-archive-keyring.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/oneapi-archive-keyring.gpg] https://apt.repos.intel.com/oneapi all main" \
            | sudo tee /etc/apt/sources.list.d/oneAPI.list
          sudo apt-get update -qq

      - name: Install the Intel DPC++ compiler and oneMKL
        run: |
          sudo apt-get install -y --no-install-recommends \
            intel-oneapi-compiler-dpcpp-cpp intel-oneapi-mkl-devel

      - name: Configure and build
        shell: bash
        run: |
          set +e; source /opt/intel/oneapi/setvars.sh; set -e
          cmake -S . -B build-ci -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=$(which icx) \
            -DCMAKE_CXX_COMPILER=$(which icpx) \
            -DABLSTEADY_MPI=OFF \
            -DABLSTEADY_GPU_BACKEND=SYCL
          cmake --build build-ci --parallel

  # ---------------------------------------------------------------------
  # RT-1.3.1: code copied from ERF must match extern_erf/EXTRACTED.md at
  # the pinned ERF SHA. The job also lists upstream ERF changes to each
  # copied file since its pin; that list is a report and never fails.
  # ---------------------------------------------------------------------
  extern-erf-drift:
    name: extern_erf drift check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Clone ERF (history only; files fetched on demand)
        run: git clone --filter=blob:none --no-checkout https://github.com/erf-model/ERF.git "$RUNNER_TEMP/ERF"

      - name: Drift check self-tests
        working-directory: tools
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 -m unittest -v test_check_extern_erf

      - name: Drift check and upstream report
        run: |
          python3 tools/check_extern_erf.py --erf "$RUNNER_TEMP/ERF" \
            --report-upstream origin/development

  # ---------------------------------------------------------------------
  # Spelling and whitespace, as in the multi-code PR checklist.
  # ---------------------------------------------------------------------
  lint:
    name: Spelling and whitespace
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: codespell
        run: |
          python -m pip install codespell
          # The codespell package has no __main__ module, so `python -m
          # codespell` fails; call its console script. Settings: .codespellrc.
          codespell

      - name: No trailing whitespace
        run: |
          # Copies of ERF files and gold outputs stay byte-identical to their
          # source (.gitattributes), so they are not checked.
          if git grep -nI '[[:space:]]$' -- ':!external' ':!extern_erf' ':!Tests/**/Gold/**'; then
            echo "Trailing whitespace on the lines above."
            exit 1
          fi
